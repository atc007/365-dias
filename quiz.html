<style>
  :root{
    --bg:#0E0D0B;
    --ink:#F5F1E8;
    --gold:#C9A96E;
    --gold-soft:#E8D09A;
    --line:rgba(245,241,232,.14);
    --card:rgba(255,255,255,.06);
    --card-border:rgba(255,255,255,.12);
    --muted:#A8A29A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  .serif{font-family:Georgia,"Times New Roman",serif;}

  /* FUNDO ANIMADO */
  .bg-animated{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:var(--bg);
  }
  .bg-animated::before,
  .bg-animated::after{
    content:'';
    position:absolute;
    width:70vmax;
    height:70vmax;
    border-radius:50%;
    filter:blur(90px);
    opacity:.35;
  }
  .bg-animated::before{
    background:radial-gradient(circle, #C9A96E 0%, transparent 70%);
    top:-20%;
    left:-20%;
    animation:float1 22s ease-in-out infinite;
  }
  .bg-animated::after{
    background:radial-gradient(circle, #6B4BC8 0%, transparent 70%);
    bottom:-25%;
    right:-15%;
    animation:float2 26s ease-in-out infinite;
  }
  @keyframes float1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(10vw,8vh) scale(1.15); }
  }
  @keyframes float2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-8vw,-10vh) scale(1.2); }
  }
  @media(prefers-reduced-motion:reduce){
    .bg-animated::before,.bg-animated::after{ animation:none; }
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:560px;
    margin:0 auto;
    padding:0 20px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header.top{
    padding:28px 0 8px;
    text-align:center;
  }
  header.top .logo-link{ display:inline-block; }
  header.top .logo-link img{
    height:28px;
    width:auto;
    display:block;
    margin:0 auto;
    filter:brightness(0) invert(1);
    opacity:.92;
  }
  .progress-track{
    width:100%;
    height:5px;
    background:var(--line);
    border-radius:3px;
    margin-top:18px;
    overflow:hidden;
  }
  .progress-fill{
    position:relative;
    height:100%;
    background:linear-gradient(90deg, var(--gold), var(--gold-soft), var(--gold));
    width:0%;
    border-radius:3px;
    overflow:hidden;
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .progress-fill::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
    width:60%;
    animation:progressShimmer 1.6s linear infinite;
  }
  @keyframes progressShimmer{
    from{ transform:translateX(-120%); }
    to{ transform:translateX(220%); }
  }
  @media(prefers-reduced-motion:reduce){
    .progress-fill::after{ animation:none; }
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:24px 0 48px;
  }

  /* GLASS CARD (translúcido, usado na intro/perguntas/resultado) */
  .glass-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:22px;
    padding:32px 24px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 8px 40px rgba(0,0,0,.35);
  }

  /* INTRO */
  #screen-intro{ text-align:center; }
  #screen-intro h1{
    font-size:29px;
    line-height:1.25;
    margin:6px 0 14px;
  }
  #screen-intro p{
    color:var(--muted);
    font-size:16px;
    line-height:1.6;
    margin:0 0 26px;
  }
  .covers-row{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:24px;
  }
  .covers-row img{
    width:clamp(58px, 17vw, 92px);
    height:clamp(58px, 17vw, 92px);
    object-fit:cover;
    border-radius:12px;
    border:1px solid var(--card-border);
    box-shadow:0 8px 20px rgba(0,0,0,.45);
    transform:rotate(var(--tilt,0deg));
    transition:transform .25s ease;
    animation:coverFloat 4s ease-in-out infinite;
    animation-delay:var(--delay,0s);
  }
  .covers-row img:hover{ transform:rotate(0deg) translateY(-4px) scale(1.05); }
  .covers-row img:nth-child(1){ --tilt:-8deg; --delay:0s; margin-top:8px; }
  .covers-row img:nth-child(2){ --tilt:-4deg; --delay:.15s; margin-top:3px; }
  .covers-row img:nth-child(3){ --tilt:0deg; --delay:.3s; }
  .covers-row img:nth-child(4){ --tilt:4deg; --delay:.45s; margin-top:3px; }
  .covers-row img:nth-child(5){ --tilt:8deg; --delay:.6s; margin-top:8px; }
  @keyframes coverFloat{
    0%,100%{ translate:0 0; }
    50%{ translate:0 -5px; }
  }
  @media(prefers-reduced-motion:reduce){
    .covers-row img{ animation:none; }
  }

  /* QUESTIONS */
  .q-block{ display:none; }
  .q-block.active{ display:block; animation:slideIn .35s cubic-bezier(.2,.8,.2,1); }
  .q-block.leaving{ display:block; animation:slideOut .2s ease forwards; }
  @keyframes slideIn{ from{opacity:0; transform:translateX(28px);} to{opacity:1; transform:translateX(0);} }
  @keyframes slideOut{ from{opacity:1; transform:translateX(0);} to{opacity:0; transform:translateX(-28px);} }
  .q-eyebrow{
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin-bottom:10px;
  }
  .q-title{
    font-size:22px;
    line-height:1.35;
    margin:0 0 22px;
  }
  .option{
    display:block;
    position:relative;
    width:100%;
    text-align:left;
    background:rgba(255,255,255,.04);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:16px 44px 16px 18px;
    margin-bottom:12px;
    font-size:16px;
    line-height:1.45;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease, background .15s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .option:hover{ border-color:var(--gold); background:rgba(255,255,255,.08); transform:translateX(3px); }
  .option:active{ transform:scale(0.98); }
  .option:disabled{ cursor:default; }
  .option.selected{
    border-color:var(--gold);
    background:rgba(201,169,110,.22);
    box-shadow:0 0 0 3px rgba(201,169,110,.18);
    transform:scale(0.99);
  }
  .option.selected::after{
    content:'✓';
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%) scale(0);
    color:var(--gold);
    font-weight:700;
    font-size:18px;
    animation:checkPop .25s ease forwards;
  }
  @keyframes checkPop{
    0%{ transform:translateY(-50%) scale(0); }
    60%{ transform:translateY(-50%) scale(1.3); }
    100%{ transform:translateY(-50%) scale(1); }
  }

  .btn-primary{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--gold);
    color:#1C1C1A;
    text-decoration:none;
    padding:17px 28px;
    border-radius:999px;
    font-size:16px;
    font-weight:700;
    border:none;
    cursor:pointer;
    width:100%;
    text-align:center;
    position:relative;
    transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
    box-shadow:0 4px 20px rgba(201,169,110,.35);
    animation:btnPulse 2.6s ease-in-out infinite;
  }
  .btn-primary::after{
    content:'→';
    display:inline-block;
    transition:transform .2s ease;
  }
  .btn-primary:hover{
    filter:brightness(1.1);
    transform:translateY(-2px);
    box-shadow:0 8px 28px rgba(201,169,110,.5);
    animation-play-state:paused;
  }
  .btn-primary:hover::after{ transform:translateX(4px); }
  .btn-primary:active{ transform:translateY(0) scale(.97); }
  @keyframes btnPulse{
    0%,100%{ box-shadow:0 4px 20px rgba(201,169,110,.35), 0 0 0 0 rgba(201,169,110,.45); }
    50%{ box-shadow:0 4px 20px rgba(201,169,110,.35), 0 0 0 8px rgba(201,169,110,0); }
  }
  @media(prefers-reduced-motion:reduce){
    .btn-primary{ animation:none; }
  }
  .btn-text{
    display:block;
    text-align:center;
    margin-top:16px;
    color:var(--muted);
    font-size:14px;
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    width:100%;
  }

  /* RESULT */
  @keyframes fade{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  #screen-result{ display:none; text-align:center; }
  #screen-result.active{ display:block; animation:fade .5s cubic-bezier(.2,.8,.2,1); }
  .result-eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin-bottom:10px;
  }
  .result-card{
    margin:12px 0 20px;
  }
  .result-cover{
    width:min(200px, 60vw);
    height:min(200px, 60vw);
    object-fit:cover;
    border-radius:18px;
    margin:0 auto 22px;
    display:block;
    box-shadow:0 16px 44px rgba(0,0,0,.55);
    border:1px solid var(--card-border);
    animation:coverReveal .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes coverReveal{
    from{ opacity:0; transform:scale(.85) translateY(10px); }
    to{ opacity:1; transform:scale(1) translateY(0); }
  }
  .result-tag{
    font-size:14px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .result-name{
    font-size:26px;
    line-height:1.3;
    margin:0 0 14px;
  }
  .result-desc{
    font-size:16px;
    line-height:1.6;
    color:var(--muted);
    margin:0 0 24px;
  }

  /* "VOCÊ PODE GOSTAR TAMBÉM" */
  .also-like{
    margin-top:16px;
    text-align:left;
    padding:18px;
    animation:fade .6s cubic-bezier(.2,.8,.2,1) .15s backwards;
  }
  .also-like-title{
    font-size:11px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:14px;
  }
  .also-like-row{
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
    color:var(--ink);
  }
  .also-like-row img{
    width:56px;
    height:56px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid var(--card-border);
    box-shadow:0 6px 16px rgba(0,0,0,.4);
    flex-shrink:0;
    transition:transform .2s ease;
  }
  .also-like-row:hover img{ transform:scale(1.06); }
  .also-like-info{ flex:1; min-width:0; }
  .also-like-name{
    font-family:Georgia,"Times New Roman",serif;
    font-size:16px;
    margin-bottom:2px;
  }
  .also-like-tag{
    font-size:13px;
    color:var(--muted);
  }
  .also-like-arrow{
    color:var(--gold);
    font-size:18px;
    flex-shrink:0;
    transition:transform .2s ease;
  }
  .also-like-row:hover .also-like-arrow{ transform:translateX(4px); }

  footer.bottom{
    text-align:center;
    padding:20px 0 32px;
    color:var(--muted);
    font-size:12px;
  }
  footer.bottom a{ color:var(--muted); }
</style>

   pra decidir o resultado de forma mais direta (menos empate entre produtos). */
const QUESTIONS = [

      { label: "Minha rotina é bagunçada, sem nenhum hábito que se sustente", scores: { "365-dias": 4 } },
      { label: "Não sei nem por onde começar, quero entender o minimalismo de verdade", scores: { "seja-minimalista": 4 } },
      { label: "Todas as opções acima — sinto que está tudo bagunçado ao mesmo tempo", scores: { "seja-minimalista": 4 }, pinLast: true }
    ]
  },
  {
    eyebrow: "Pergunta 2 de 4",
    title: "Quando você tenta resolver isso, o que mais costuma acontecer?",
    options: [
      { label: "Começo a separar as coisas, mas não consigo terminar a organização da casa", scores: { "destralhe": 3 } },
      { label: "Tiro algumas roupas, mas logo o guarda-roupa volta a ficar cheio e difícil de usar", scores: { "armario-enxuto": 3 } },
      { label: "Tento viajar com menos, mas sempre fico na dúvida sobre o que levar", scores: { "viajante-minimalista": 3 } },
      { label: "Começo uma rotina nova, mas depois de alguns dias acabo abandonando", scores: { "365-dias": 3 } },
      { label: "Consumo conteúdo sobre minimalismo, mas continuo sem saber como transformar a ideia em prática", scores: { "seja-minimalista": 3 } },
      { label: "Um pouco de tudo isso — começo várias coisas e não sei nem por onde focar primeiro", scores: { "seja-minimalista": 3 }, pinLast: true }
    ]
  },
  {
    eyebrow: "Pergunta 3 de 4",
    title: "Como você gostaria de começar essa mudança?",
    options: [
      { label: "Seguindo um passo a passo pra destralhar a casa, avançando um pouco a cada dia", scores: { "destralhe": 2 } },
      { label: "Aprendendo a decidir o que realmente merece ficar no meu guarda-roupa", scores: { "armario-enxuto": 2 } },
      { label: "Aplicando o minimalismo especificamente nas minhas próximas viagens", scores: { "viajante-minimalista": 2 } },
      { label: "Começando com pequenas ações que eu consiga repetir todos os dias", scores: { "365-dias": 2 } },
      { label: "Primeiro entendendo os princípios do minimalismo antes de decidir o que mudar", scores: { "seja-minimalista": 2 } },
      { label: "Ainda não sei — acho que preciso de uma visão geral antes de escolher uma área", scores: { "seja-minimalista": 2 }, pinLast: true }
    ]
  },
  {
    eyebrow: "Pergunta 4 de 4",
    title: "Qual resultado faria você terminar este quiz pensando \"era exatamente isso que eu precisava\"?",
    options: [
      { label: "Olhar pra minha casa e sentir que finalmente tenho menos coisas e mais espaço", scores: { "destralhe": 5 } },
      { label: "Abrir meu guarda-roupa e saber exatamente o que vestir", scores: { "armario-enxuto": 5 } },
      { label: "Viajar com uma mala mais leve e sem ficar pensando tanto nas coisas", scores: { "viajante-minimalista": 5 } },
      { label: "Conseguir manter hábitos simples sem precisar recomeçar toda hora", scores: { "365-dias": 5 } },
      { label: "Ter mais clareza sobre o que realmente importa e por onde começar", scores: { "seja-minimalista": 5 } },
      { label: "Ter uma visão clara de tudo, pra depois decidir por onde começar", scores: { "seja-minimalista": 5 }, pinLast: true }
    ]
  }
];

/* Peso de cada pergunta, na ordem — usado no desempate (pergunta de maior peso decide) */
const QUESTION_WEIGHTS = [4, 3, 2, 5];

/* ---------- LÓGICA DO QUIZ ---------- */
let currentQ = 0;
let scores = {};
let answersLog = []; // { qIndex, productKey, label } por pergunta respondida
Object.keys(PRODUCTS).forEach(k => scores[k] = 0);

const questionsContainer = document.getElementById('questions');
const progressFill = document.getElementById('progressFill');

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuestions(){
  QUESTIONS.forEach((q, qi) => {
    const block = document.createElement('div');
    block.className = 'q-block';
    block.id = 'q-' + qi;

    const eyebrow = document.createElement('div');
    eyebrow.className = 'q-eyebrow';
    eyebrow.textContent = q.eyebrow;
    block.appendChild(eyebrow);

    const title = document.createElement('h2');
    title.className = 'serif q-title';
    title.textContent = q.title;
    block.appendChild(title);

    // embaralha a ordem das opções (evita viés de primazia), mas mantém
    // as opções marcadas com pinLast sempre no final, na ordem original
    const normalOpts = shuffle(q.options.filter(o => !o.pinLast));
    const pinnedOpts = q.options.filter(o => o.pinLast);
    normalOpts.concat(pinnedOpts).forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.type = 'button';
      btn.textContent = opt.label;
      btn.onclick = () => selectOption(qi, opt, btn, block);
      block.appendChild(btn);
    });

    questionsContainer.appendChild(block);
  });
}
buildQuestions();

function buildCoversRow(){
  const row = document.getElementById('coversRow');
  Object.keys(PRODUCTS).forEach(key => {
    const img = document.createElement('img');
    img.src = PRODUCTS[key].cover;
    img.alt = PRODUCTS[key].name;
    img.loading = 'eager';
    row.appendChild(img);
  });
}
buildCoversRow();

function trackEvent(name, params){
  if (window.dataLayer) window.dataLayer.push(Object.assign({event:name}, params||{}));
  if (window.fbq) fbq('trackCustom', name, params||{});
  if (window.gtag) gtag('event', name, params||{});
}

function startQuiz(){
  document.getElementById('screen-intro').style.display = 'none';
  questionsContainer.style.display = 'block';
  showQuestion(0);
  trackEvent('quiz_start');
}

function showQuestion(index){
  document.querySelectorAll('.q-block').forEach(el => el.classList.remove('active', 'leaving'));
  const block = document.getElementById('q-' + index);
  if (block) block.classList.add('active');
  progressFill.style.width = (index / QUESTIONS.length * 100) + '%';
}

function selectOption(qIndex, opt, btnEl, block){
  // feedback imediato: marca a opção escolhida, desabilita as outras e mostra o check
  block.querySelectorAll('.option').forEach(b => { b.disabled = true; });
  btnEl.classList.add('selected');

  // pequena pausa pra pessoa ver a resposta marcada antes de avançar
  setTimeout(() => {
    block.classList.add('leaving');
    setTimeout(() => answer(qIndex, opt), 180);
  }, 260);
}

function answer(qIndex, opt){
  const productKey = Object.keys(opt.scores)[0];
  Object.keys(opt.scores).forEach(key => {
    scores[key] = (scores[key] || 0) + opt.scores[key];
  });
  answersLog[qIndex] = { qIndex: qIndex, productKey: productKey, label: opt.label };

  trackEvent('quiz_answer', { question_index: qIndex + 1 });

  if (qIndex + 1 < QUESTIONS.length){
    currentQ = qIndex + 1;
    showQuestion(currentQ);
  } else {
    showResult();
  }
}

function pickWinner(){
  // A Pergunta 1 ("o que mais te incomoda hoje?") é a dor principal — ela é quem
  // decide o produto. As perguntas seguintes servem pra confirmar/detalhar, não
  // pra "diluir" esse sinal com pontos somados de respostas de outros domínios.
  const dorDomain = answersLog[0] && answersLog[0].productKey;

  // Exceção: se a pessoa sinalizou tanto "viagem" quanto "guarda-roupa" como
  // problemas (em perguntas diferentes, mesmo que a dor principal seja só uma
  // delas), o caso dela é mais amplo do que um produto específico resolve —
  // o ideal é começar pela base, o Seja Minimalista.
  const touchedViagem = answersLog.some(a => a && a.productKey === 'viajante-minimalista');
  const touchedArmario = answersLog.some(a => a && a.productKey === 'armario-enxuto');
  if (touchedViagem && touchedArmario) return 'seja-minimalista';

  return dorDomain || Object.keys(PRODUCTS)[0];
}

/* Produtos "de entrada", mais generalistas — usados como segunda sugestão
   pra quem já recebeu uma recomendação específica (viagem ou guarda-roupa) */
const GENERIC_PRODUCTS = ['seja-minimalista', '365-dias', 'destralhe'];

function pickSecondSuggestion(winnerKey){
  // Nunca repete o produto principal. Prioriza, entre os genéricos, o que teve
  // mais pontos nas respostas (sinal de que também ressoou com a pessoa);
  // se nada além do vencedor foi tocado, cai na ordem padrão abaixo.
  const candidates = GENERIC_PRODUCTS.filter(key => key !== winnerKey);
  candidates.sort((a, b) => (scores[b] || 0) - (scores[a] || 0));
  return candidates[0];
}

function showResult(){
  document.querySelectorAll('.q-block').forEach(el => el.classList.remove('active'));
  questionsContainer.style.display = 'none';
  progressFill.style.width = '100%';

  const winnerKey = pickWinner();
  const product = PRODUCTS[winnerKey];

  const coverImg = document.getElementById('resultCover');
  coverImg.src = product.cover;
  coverImg.alt = product.name;

  document.getElementById('resultTag').textContent = product.tag;
  document.getElementById('resultName').textContent = product.name;

  // Explicação dinâmica: usa a dor (Pergunta 1) e o resultado desejado (Pergunta 4)
  // que a pessoa de fato escolheu, além da descrição padrão do produto.
  const dor = answersLog[0] ? answersLog[0].label.toLowerCase() : '';
  const desejo = answersLog[3] ? answersLog[3].label.toLowerCase() : '';
  let explicacao = product.desc;
  if (dor && desejo){
    explicacao = 'Pelas suas respostas, o que mais parece te incomodar hoje é: ' + dor +
      '. E o resultado que você busca é: ' + desejo +
      '. Por isso, o ' + product.name + ' faz mais sentido pra você agora.';
  }
  document.getElementById('resultDesc').textContent = explicacao;

  const cta = document.getElementById('resultCta');
  const url = new URL(product.url);
  url.searchParams.set('utm_source', 'instagram');
  url.searchParams.set('utm_medium', 'bio');
  url.searchParams.set('utm_campaign', 'quiz_livro_ideal');
  url.searchParams.set('utm_content', winnerKey);
  cta.href = url.toString();
  cta.textContent = 'Quero conhecer o ' + product.name;

  // "Você pode gostar também" — segunda sugestão, mais generalista
  const secondKey = pickSecondSuggestion(winnerKey);
  const secondProduct = PRODUCTS[secondKey];
  document.getElementById('alsoLikeCover').src = secondProduct.cover;
  document.getElementById('alsoLikeCover').alt = secondProduct.name;
  document.getElementById('alsoLikeName').textContent = secondProduct.name;
  document.getElementById('alsoLikeTag').textContent = secondProduct.tag;

  const alsoLikeCard = document.getElementById('alsoLikeCard');
  const secondUrl = new URL(secondProduct.url);
  secondUrl.searchParams.set('utm_source', 'instagram');
  secondUrl.searchParams.set('utm_medium', 'bio');
  secondUrl.searchParams.set('utm_campaign', 'quiz_livro_ideal');
  secondUrl.searchParams.set('utm_content', 'secundario-' + secondKey);
  alsoLikeCard.href = secondUrl.toString();
  alsoLikeCard.onclick = () => trackEvent('quiz_also_like_click', { result_product: winnerKey, second_product: secondKey });

  document.getElementById('screen-result').classList.add('active');

  trackEvent('quiz_complete', { result_product: winnerKey });
}

function restartQuiz(){
  currentQ = 0;
  answersLog = [];
  Object.keys(PRODUCTS).forEach(k => scores[k] = 0);
  document.querySelectorAll('.option').forEach(b => {
    b.disabled = false;
    b.classList.remove('selected');
  });
  document.querySelectorAll('.q-block').forEach(el => el.classList.remove('active', 'leaving'));
  document.getElementById('screen-result').classList.remove('active');
  document.getElementById('screen-intro').style.display = 'block';
  progressFill.style.width = '0%';
}
</script>
