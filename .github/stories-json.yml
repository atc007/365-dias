name: Atualizar lista de stories (365 Dias)

on:
  push:
    branches: [main]
    paths:
      - '365-dep/**'
      - '!365-dep/stories.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar 365-dep/stories.json
        run: |
          python3 - <<'PY'
          import os, json
          pasta = '365-dep'
          arquivos = sorted(f for f in os.listdir(pasta)
                            if f.lower().endswith(('.jpg', '.jpeg', '.png', '.webp')))
          with open(os.path.join(pasta, 'stories.json'), 'w', encoding='utf-8') as fh:
              json.dump(arquivos, fh, ensure_ascii=False, indent=0)
          print(len(arquivos), 'imagens')
          PY

      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 365-dep/stories.json
          git diff --cached --quiet || (git commit -m "Atualiza stories.json [skip ci]" && git push)
